name: astrbot_plugin_smart_join_chat
display_name: Smart Join Chat
short_desc: Decide contextually whether the bot should join a group chat.
desc: >-
  Adds a context-aware active-reply method that asks a separate model whether
  the bot should participate, with optional probability gating.
version: 1.0.2
author: Astricaelus
repo: https://github.com/Astricaelus/SmartJoinChat
astrbot_version: ">=4.29.0,<4.30"
support_platforms:
  - aiocqhttp
  - qq_official
  - qq_official_webhook
  - telegram
  - wecom
  - wecom_ai_bot
  - lark
  - dingtalk
  - discord
  - slack
  - kook
  - vocechat
  - weixin_official_account
  - weixin_oc
  - satori
  - misskey
  - line
  - matrix
  - mattermost
